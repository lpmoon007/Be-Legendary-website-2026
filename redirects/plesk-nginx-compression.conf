# ─────────────────────────────────────────────────────────────────────────
# Compression for belegendary.org  (Plesk → nginx)
#
# WHY: Plesk serves static files (.html/.css/.js) directly from nginx and
# never proxies them to Apache, so the mod_deflate/mod_brotli rules in
# public/.htaccess are bypassed. SEMrush's crawler requests gzip and gets
# uncompressed bytes, hence "Uncompressed pages / JS / CSS" on every page.
#
# WHERE TO PASTE (Plesk):
#   Domains → belegendary.org → Apache & nginx Settings
#   → "Additional nginx directives" box → paste everything below → OK/Apply.
#   (Plesk runs `nginx -t` on save; if it rejects the config, see the note
#    on the brotli block at the bottom.)
# ─────────────────────────────────────────────────────────────────────────

# ---- gzip: universally supported; this is the line that clears SEMrush ----
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
# (text/html is always gzipped by nginx and must NOT be listed above.)

# ---- brotli: better ratio for modern browsers. Optional. ----
# Your HTML already returns `content-encoding: br`, so the brotli module IS
# loaded — these lines extend brotli to CSS/JS/JSON/SVG too.
brotli on;
brotli_comp_level 6;
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

# If Plesk shows an "unknown directive brotli" error when you click OK, the
# brotli module isn't available in this nginx build — delete the three
# brotli_* lines above and re-save. gzip alone fully resolves the audit.
