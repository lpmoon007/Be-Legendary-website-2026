# ─────────────────────────────────────────────────────────────────────────
# Legacy 301 redirects for belegendary.org — NGINX port of public/.htaccess
#
# WHY THIS EXISTS
# belegendary.org runs on Plesk. Depending on Plesk's "Smart static files
# processing" setting, nginx can serve the static build DIRECTLY and never
# hand the request to Apache — in which case every `Redirect 301` in
# public/.htaccess is silently DEAD in production: legacy URLs return the
# branded 404 instead of redirecting. That bleeds traffic and backlink
# authority (incl. the CNN /extreme-retreats/ and Business Insider
# /shakubuku/ links) and, worst of all, sends every old retreat URL to a
# dead end right before the autumn retreat-planning season.
#
# Putting the redirects HERE (nginx) makes them fire no matter which mode
# Plesk is in — it is the robust fix.
#
# HOW TO CONFIRM YOU NEED THIS (10 seconds, from any normal network):
#   curl -sI https://www.belegendary.org/shakubuku/ | grep -iE 'HTTP|location'
#     • "301 … location: /teams/retreats/"  → .htaccess IS firing; this is belt-and-suspenders.
#     • "404" (or 200 serving the 404 page)  → .htaccess is BYPASSED; deploying this is the fix.
#
# WHERE TO PASTE (Plesk):
#   Domains → belegendary.org → Apache & nginx Settings
#   → "Additional nginx directives" → paste this block (alongside the HSTS
#     directive) → OK/Apply. Plesk validates nginx syntax on Apply, so a bad
#     paste is rejected, not shipped.
#
# VERIFY AFTER APPLYING:
#   curl -sI https://www.belegendary.org/shakubuku/                | grep -i location  # → /teams/retreats/
#   curl -sI https://www.belegendary.org/extreme-retreats/         | grep -i location  # → /teams/retreats/
#   curl -sI https://www.belegendary.org/experiential-leadership-retreats/ | grep -i location
#
# MAINTENANCE: keep this in lockstep with public/.htaccess. When a redirect
# is added/changed there, mirror it here until the .htaccess is retired.
# Rules are ordered specific-before-general (nginx `rewrite … permanent`
# stops at the first match).
# ─────────────────────────────────────────────────────────────────────────

# ── Pattern redirects (mirror Apache RedirectMatch / prefix Redirect; suffix preserved) ──
rewrite ^/about-us/contact-us/?$   /contact/                permanent;
rewrite ^/about-us(/.*)?$          /about/                  permanent;
rewrite ^/library/(.+)$            /leaders/$1              permanent;
rewrite ^/library/?$               /leaders/                permanent;
rewrite ^/engagement-cycle(/.*)?$  /how-we-work-together/   permanent;
rewrite ^/blog(/.*)?$              /field-notes/            permanent;
rewrite ^/wp-content/uploads/2015/02/Roadmap-to-Success-James-Carter\.pdf$  /roadmap-to-success/          permanent;
rewrite ^/wp-content/uploads/2015/02/Discover-Your-Inner-Strength.*$        /discover-your-inner-strength/ permanent;
rewrite ^/fractional-chief-people-officer/?$  https://provecq.com/fractional-chief-people-officer  permanent;

# ── Single-page legacy URLs → nearest live page ──
rewrite ^/leaders/30-day-challenge/?$              https://challenge.belegendary.org/     permanent;
rewrite ^/actionable-coaching/?$                   /leaders/actionable-coaching/          permanent;
rewrite ^/articles/?$                              /field-notes/                          permanent;
rewrite ^/free-leadership-tools/?$                 /resources/                            permanent;
rewrite ^/commitment-quotient/?$                   /break-point-self-assessment/          permanent;
rewrite ^/common-executive-team-challenges/?$      /teams/                                permanent;
rewrite ^/peopleops/?$                             /teams/                                permanent;
rewrite ^/terms-of-use/?$                          /privacy/                              permanent;
rewrite ^/executive-coaching/?$                    /leaders/what-is-executive-coaching/   permanent;
rewrite ^/privacy-policy/?$                        /privacy/                              permanent;
rewrite ^/strategy-activation/?$                   /how-we-work-together/                 permanent;
rewrite ^/teamworx/?$                              /teams/                                permanent;
rewrite ^/talent-management/?$                     /teams/                                permanent;
rewrite ^/cq-catalyst/?$                           /teams/                                permanent;
rewrite ^/teams/diagnostic/?$                      /teams/team-lfs/                       permanent;

# ── Legacy RETREAT URLs (these carried the CNN / Business Insider links and
#     ranked page-1; losing them is the likely cause of the retreat-lead drop) ──
rewrite ^/shakubuku/?$                             /teams/retreats/                       permanent;
rewrite ^/extreme-retreats/?$                      /teams/retreats/                       permanent;
rewrite ^/experiential-leadership-retreats/?$      /teams/retreats/                       permanent;
rewrite ^/denver-executive-leadership-retreat/?$   /executive-off-road-immersion/         permanent;
rewrite ^/sedona-executive-leadership-retreat/?$   /executive-off-road-immersion/         permanent;
