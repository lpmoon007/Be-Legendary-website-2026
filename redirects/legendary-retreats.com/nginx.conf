# 301 redirects: legendary-retreats.com -> belegendary.org  (nginx)
# Drop into the legendary-retreats.com server block if that domain stays on its
# own nginx VPS as a redirector. Exact (=) matches win over prefix (^~) matches,
# so the specific /field-notes/... and /formats/... rules are honored before the
# broader prefixes; the final `location /` is the catch-all.

server {
    listen 443 ssl;
    server_name legendary-retreats.com www.legendary-retreats.com;
    # ... existing ssl_certificate directives ...

    # Home & core
    location = /                                             { return 301 https://www.belegendary.org/teams/retreats/; }
    location = /about                                        { return 301 https://www.belegendary.org/about/james-carter/; }
    location = /contact                                      { return 301 https://www.belegendary.org/teams/retreats/ways-to-work-together/; }
    location = /ways-to-work-together                        { return 301 https://www.belegendary.org/teams/retreats/ways-to-work-together/; }
    location = /framework                                    { return 301 https://www.belegendary.org/flag-model/; }
    location = /for-executive-assistants                     { return 301 https://www.belegendary.org/teams/retreats/for-executive-assistants/; }

    # Retreats, formats & experience
    location = /leadership-retreats                          { return 301 https://www.belegendary.org/teams/retreats/; }
    location = /executive-offsites                           { return 301 https://www.belegendary.org/teams/retreats/; }
    location = /experience                                   { return 301 https://www.belegendary.org/teams/retreats/; }
    location = /is-this-your-team                            { return 301 https://www.belegendary.org/teams/retreats/; }
    location ^~ /formats/                                    { return 301 https://www.belegendary.org/teams/retreats/formats/; }
    location = /sailing-offsites                             { return 301 https://www.belegendary.org/teams/retreats/formats/; }
    location = /field-notes/signature-vs-bespoke-retreat     { return 301 https://www.belegendary.org/teams/retreats/formats/; }

    # Destinations
    location ^~ /destinations                                { return 301 https://www.belegendary.org/teams/retreats/destinations/; }

    # Offsite SEO cluster
    location = /offsite-vs-executive-retreat                 { return 301 https://www.belegendary.org/teams/executive-offsite-ideas/; }
    location = /offsite-vs-team-building                     { return 301 https://www.belegendary.org/teams/executive-offsite-ideas/; }
    location = /team-offsite-ideas                           { return 301 https://www.belegendary.org/teams/executive-offsite-ideas/; }
    location = /executive-offsite-agenda                     { return 301 https://www.belegendary.org/teams/executive-offsite-ideas/; }
    location = /executive-offsite-facilitator                { return 301 https://www.belegendary.org/leadership-team-offsite-facilitator/; }

    # Case studies — exact retreat-study matches win over the prefix fold below
    location = /case-studies/online-auto-retailer-leadership-team { return 301 https://www.belegendary.org/case-studies/online-auto-retailer-leadership-team/; }
    location = /case-studies/san-juan-mountains-work-ethic        { return 301 https://www.belegendary.org/case-studies/san-juan-mountains-work-ethic/; }
    location = /case-studies/everglades-abundance-mindset         { return 301 https://www.belegendary.org/case-studies/everglades-abundance-mindset/; }
    location = /case-studies/federal-fiscal-leadership-team       { return 301 https://www.belegendary.org/case-studies/federal-fiscal-leadership-team/; }
    location = /case-studies/alaska-executive-vulnerability       { return 301 https://www.belegendary.org/case-studies/alaska-executive-vulnerability/; }
    location ^~ /case-studies                                { return 301 https://www.belegendary.org/case-studies/; }

    # Field notes — specific mappings before the /field-notes/ prefix
    location = /field-notes/do-leadership-retreats-work                { return 301 https://www.belegendary.org/teams/leadership-retreat-ideas/; }
    location = /field-notes/what-is-an-experiential-leadership-retreat { return 301 https://www.belegendary.org/teams/leadership-retreat-ideas/; }
    location = /field-notes/align-leadership-team                      { return 301 https://www.belegendary.org/executive-team-not-aligned/; }
    location = /field-notes/newly-formed-post-merger-leadership-team   { return 301 https://www.belegendary.org/executive-team-not-aligned/; }
    location = /field-notes/30-day-reinforcement                      { return 301 https://www.belegendary.org/leaders/30-day-challenge/; }
    location = /field-notes/executive-retreat-cost                    { return 301 https://www.belegendary.org/executive-team-coaching-cost/; }
    location = /field-notes                                            { return 301 https://www.belegendary.org/field-notes/; }
    location ^~ /field-notes/                                          { return 301 https://www.belegendary.org/field-notes/; }
    location = /the-connection-deficit                                { return 301 https://www.belegendary.org/field-notes/; }

    # Catch-all
    location / { return 301 https://www.belegendary.org/teams/retreats/; }
}
