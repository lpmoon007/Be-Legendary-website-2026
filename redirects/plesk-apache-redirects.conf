# ─────────────────────────────────────────────────────────────────────────
# Legacy 301 redirects for belegendary.org — APACHE syntax
#
# WHEN TO USE THIS FILE (vs. plesk-nginx-redirects.conf):
#   Use THIS one if pasting the nginx block gives the Apache error
#     "AH00526 … Invalid command 'rewrite'"
#   — that means your paste is landing in an APACHE config field, which only
#   understands Apache directives (Redirect / RedirectMatch), not nginx's
#   `rewrite … permanent;`. These directives below ARE valid Apache.
#
# EVERY rule uses RedirectMatch with an optional-slash anchor (^/path/?$) so BOTH
# /path and /path/ redirect. (A plain `Redirect /path/` only matches the
# trailing-slash prefix, so the no-slash form — which AI engines and humans hit —
# fell through to a 404.)
#
# FIRST, THOUGH — YOU MAY NOT NEED TO PASTE ANYTHING:
#   These same redirects already live in the deployed public/.htaccess. If
#   Apache reads .htaccess on this domain, they already work. Test:
#     curl -sI https://www.belegendary.org/executive-off-road-immersion | grep -i location
#       • 301 → legendary-retreats.com/executive-off-road-immersion/  = already working, hit Cancel.
#       • 200 or 404                                                  = .htaccess is bypassed; paste this.
#
# WHERE TO PASTE (Plesk):
#   Domains → belegendary.org → Apache & nginx Settings
#   → "Additional Apache directives" (and the HTTPS box, if shown separately)
#   → paste the block below → OK/Apply.
#   (mod_alias is always enabled, so Redirect/RedirectMatch need no RewriteEngine.)
#
# VERIFY AFTER APPLYING (test the NO-slash form — that's the one that was broken):
#   curl -sI https://www.belegendary.org/executive-off-road-immersion | grep -i location
#   curl -sI https://www.belegendary.org/teams/retreats              | grep -i location
#   curl -sI https://www.belegendary.org/shakubuku                   | grep -i location
#
# MAINTENANCE: keep in lockstep with public/.htaccess (the source of truth) and
# with plesk-nginx-redirects.conf. These are the RedirectMatch lines from
# .htaccess, verbatim — nothing else (no DirectoryIndex, no compression/expires:
# those belong only in .htaccess, not a vhost field).
# ─────────────────────────────────────────────────────────────────────────

# ── Library → Leaders ──
RedirectMatch 301 ^/library/(.+)$ /leaders/$1
RedirectMatch 301 ^/library/?$ /leaders/

# ── 30-Day Challenge (canonical slug → live app subdomain) ──
RedirectMatch 301 ^/leaders/30-day-challenge/?$ https://challenge.belegendary.org/

# ── Retired pages from the previous site ──
RedirectMatch 301 ^/actionable-coaching/?$ /leaders/actionable-coaching/
RedirectMatch 301 ^/articles/?$ /field-notes/
RedirectMatch 301 ^/free-leadership-tools/?$ /resources/
RedirectMatch 301 ^/commitment-quotient/?$ /break-point-self-assessment/
RedirectMatch 301 ^/common-executive-team-challenges/?$ /teams/
RedirectMatch 301 ^/peopleops/?$ /teams/
RedirectMatch 301 ^/terms-of-use/?$ /privacy/

# ── Legacy URLs still ranking but 404ing ──
