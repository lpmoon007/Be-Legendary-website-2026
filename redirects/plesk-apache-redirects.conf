# ─────────────────────────────────────────────────────────────────────────
# Legacy 301 redirects for belegendary.org — APACHE syntax
#
# WHEN TO USE THIS FILE (vs. plesk-nginx-redirects.conf):
#   Use THIS one if pasting the nginx block gives the Apache error
#     "AH00526 … Invalid command 'rewrite'"
#   — that means your paste is landing in an APACHE config field, which only
#   understands Apache directives (Redirect / RedirectMatch), not nginx's
#   `rewrite … permanent;`. These directives below ARE valid Apache.
#
# FIRST, THOUGH — YOU MAY NOT NEED TO PASTE ANYTHING:
#   These same redirects already live in the deployed public/.htaccess. If
#   Apache reads .htaccess on this domain, they already work. Test:
#     curl -sI https://www.belegendary.org/sedona-executive-leadership-retreat/ | grep -i location
#       • 301 → …/destinations/sedona-arizona/  = already working, hit Cancel.
#       • 200 or 404                            = .htaccess is bypassed; paste this.
#
# WHERE TO PASTE (Plesk):
#   Domains → belegendary.org → Apache & nginx Settings
#   → "Additional Apache directives" (and the HTTPS box, if shown separately)
#   → paste the block below → OK/Apply.
#   (mod_alias is always enabled, so Redirect/RedirectMatch need no RewriteEngine.)
#
# VERIFY AFTER APPLYING:
#   curl -sI https://www.belegendary.org/sedona-executive-leadership-retreat/ | grep -i location  # → /destinations/sedona-arizona/
#   curl -sI https://www.belegendary.org/denver-executive-leadership-retreat/ | grep -i location  # → /destinations/colorado/
#   curl -sI https://www.belegendary.org/shakubuku/ | grep -i location                            # → legendary-retreats.com/
#
# MAINTENANCE: keep in lockstep with public/.htaccess (the source of truth)
# and with plesk-nginx-redirects.conf. These are the Redirect/RedirectMatch
# lines from .htaccess, verbatim — nothing else (no DirectoryIndex, no
# compression/expires: those belong only in .htaccess, not a vhost field).
# ─────────────────────────────────────────────────────────────────────────

# ── Library → Leaders ──
Redirect 301 /library/ /leaders/

# ── 30-Day Challenge (canonical slug → live app subdomain) ──
Redirect 301 /leaders/30-day-challenge/ https://challenge.belegendary.org/

# ── Retired pages from the previous site ──
Redirect 301 /actionable-coaching/ /leaders/actionable-coaching/
Redirect 301 /articles/ /field-notes/
Redirect 301 /free-leadership-tools/ /resources/
Redirect 301 /commitment-quotient/ /break-point-self-assessment/
Redirect 301 /common-executive-team-challenges/ /teams/
Redirect 301 /peopleops/ /teams/
Redirect 301 /terms-of-use/ /privacy/

# ── Legacy URLs still ranking but 404ing ──
Redirect 301 /shakubuku/ https://www.legendary-retreats.com/
Redirect 301 /extreme-retreats/ https://www.legendary-retreats.com/
Redirect 301 /experiential-leadership-retreats/ https://www.legendary-retreats.com/
Redirect 301 /executive-coaching/ /leaders/what-is-executive-coaching/
RedirectMatch 301 ^/about-us/contact-us/?$ /contact/
RedirectMatch 301 ^/about-us(/.*)?$ /about/
Redirect 301 /privacy-policy/ /privacy/
RedirectMatch 301 ^/engagement-cycle(/.*)?$ /how-we-work-together/
Redirect 301 /strategy-activation/ /how-we-work-together/
Redirect 301 /teamworx/ /teams/
Redirect 301 /talent-management/ /teams/
Redirect 301 /cq-catalyst/ /teams/

# ── Retreat geo pages → legendary-retreats.com destination pages ──
Redirect 301 /denver-executive-leadership-retreat/ https://www.legendary-retreats.com/destinations/colorado/
Redirect 301 /sedona-executive-leadership-retreat/ https://www.legendary-retreats.com/destinations/sedona-arizona/

# ── Fractional Chief People Officer → Prove ──
RedirectMatch 301 ^/fractional-chief-people-officer/?$ https://provecq.com/fractional-chief-people-officer

# ── Legacy WordPress assets & blog ──
RedirectMatch 301 ^/wp-content/uploads/2015/02/Roadmap-to-Success-James-Carter\.pdf$ /roadmap-to-success/
RedirectMatch 301 ^/wp-content/uploads/2015/02/Discover-Your-Inner-Strength.*$ /discover-your-inner-strength/
RedirectMatch 301 ^/blog(/.*)?$ /field-notes/

# ── Backlinked legacy URLs still 404ing ──
Redirect 301 /effective-facilitator-workshop/ https://www.legendary-retreats.com/leadership-team-offsite-facilitator/
Redirect 301 /mindset-information/ /leaders/
RedirectMatch 301 ^/index\.php(/.*)?$ /

