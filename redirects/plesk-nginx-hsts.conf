# ─────────────────────────────────────────────────────────────────────────
# HSTS for belegendary.org  (Plesk → nginx)
#
# STATUS: NOT YET APPLIED. Semrush still flagged "No HSTS support" on the
# 2026-08-26 audit, so this directive has not been pasted into Plesk yet.
# It is a manual server-side step (see docs/DEPLOY.md → "Manual server-side
# steps") — the auto-deploy rsync does not touch nginx config.
#
# WHY: SEMrush flags "No HSTS support". HSTS tells browsers to only ever
# connect over HTTPS, closing the brief HTTP→HTTPS redirect window.
#
# WHERE TO PASTE (Plesk):
#   Domains → belegendary.org → Apache & nginx Settings
#   → "Additional nginx directives" box → add the line below (alongside the
#     compression block) → OK/Apply.
#
# NOTE ON `preload`: intentionally omitted. Adding `; preload` and submitting
# at hstspreload.org is a hard-to-reverse commitment that forces HTTPS on every
# *.belegendary.org subdomain permanently. Ship this first; add preload later
# only once you're certain every subdomain is permanently HTTPS.
# includeSubDomains is safe today: challenge.belegendary.org is HTTPS.
# ─────────────────────────────────────────────────────────────────────────

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
